<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1ea">
<title>Today's Mission</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f5f1ea;color:#292722;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{max-width:430px;margin:0 auto;min-height:100vh;padding:28px 20px 32px;display:flex;flex-direction:column}
.kicker{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.58;font-weight:700}
h1{font-size:32px;line-height:1.05;margin:7px 0 20px}
.date{opacity:.58;font-size:14px;margin-bottom:18px}
.quote{background:#fff;border-radius:22px;padding:22px 20px;margin-bottom:18px;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.quote .label{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.5;margin-bottom:10px}
.quote p{font-size:20px;line-height:1.32;font-weight:700;margin:0}
.mission{background:#fff;border-radius:22px;padding:8px 8px;box-shadow:0 3px 14px rgba(0,0,0,.05)}
.row{display:flex;align-items:center;gap:14px;padding:16px 12px;border-bottom:1px solid #eee9e1;cursor:pointer;user-select:none}
.row:last-child{border-bottom:0}
input{appearance:none;width:25px;height:25px;border:2px solid #77716a;border-radius:8px;flex:0 0 auto}
input:checked{background:#292722;border-color:#292722;position:relative}
input:checked:after{content:"✓";color:#fff;position:absolute;font-size:17px;left:3px;top:-1px;font-weight:800}
.text{font-size:16px;line-height:1.25}
.sub{font-size:12px;opacity:.52;margin-top:3px}
.progress{margin-top:16px;font-size:13px;opacity:.58;text-align:center}
.reset{display:block;margin:14px auto 0;background:none;border:0;color:#6b655d;text-decoration:underline;font-size:12px}
.note{font-size:12px;line-height:1.45;opacity:.52;text-align:center;margin:22px 12px 0}
</style></head>
<body><main class="card">
<div class="kicker">Daily mission</div>
<h1>Keep showing up.</h1>
<div class="date" id="date"></div>

<section class="quote">
  <div class="label">Today's mindset</div>
  <p id="affirmation"></p>
</section>

<section class="mission">
  <label class="row"><input type="checkbox" data-key="treats"><span class="text">No treats</span></label>
  <label class="row"><input type="checkbox" data-key="food"><span class="text">Normal food</span></label>
  <label class="row"><input type="checkbox" data-key="exercise"><span><span class="text" id="exercise"></span><div class="sub">Today's movement</div></span></label>
  <label class="row"><input type="checkbox" data-key="water"><span class="text">Drink water</span></label>
  <label class="row"><input type="checkbox" data-key="mindset"><span class="text">Read today's mindset</span></label>
</section>

<div class="progress" id="progress">0 / 5 complete</div>
<button class="reset" onclick="resetToday()">Reset today's boxes</button>
<div class="note">A missed box doesn't erase your progress. Tomorrow is simply another day.</div>
</main>
<script>
const affirmations = ["Keep going. The results will come, even if you can't see them yet.", "You don't have to feel like doing it. Just start.", "The version of you you're working toward is built by what you do today.", "Don't quit because the results aren't visible yet.", "You will be glad you kept going.", "One good choice won't change everything. But repeated good choices will.", "You don't need motivation. You need one small action.", "Keep showing up. That's how things change.", "The discomfort of saying no is temporary. The satisfaction of keeping your promise lasts longer.", "You are not starting from zero. You're starting from experience.", "Don't let one urge decide what you want long-term.", "You can do something even when you don't feel like it.", "Future you is counting on today's you.", "Progress is happening even when you can't see it in the mirror.", "You don't need a perfect day. You need another day of trying.", "Stay patient. Your body needs time to catch up with your effort.", "This feeling will pass. You don't have to act on it.", "Keep the promise you made to yourself today.", "You can want change without hating who you are now.", "Don't give up just because today feels hard.", "Do it tired. Do it unmotivated. Just keep moving forward.", "Every time you choose your goal over an impulse, you're practicing who you want to become.", "You won't regret continuing.", "A few weeks from now, you'll wish you'd started today.", "Keep going. You haven't seen the full result yet."];
const exercises = ["20 jumping jacks", "20 bodyweight squats", "10 wall push-ups", "30-second plank", "20 high knees", "10 reverse lunges each leg", "20 glute bridges", "15 calf raises", "10 incline push-ups", "30-second wall sit", "20 alternating toe touches", "10 bird-dogs each side", "20 marching knee raises", "10 chair squats"];
const dayKey = new Date().toISOString().slice(0,10);
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;return Math.abs(h)}
const idx=hash(dayKey);
document.getElementById('affirmation').textContent=affirmations[idx%affirmations.length];
document.getElementById('exercise').textContent=exercises[idx%exercises.length];
document.getElementById('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
document.querySelectorAll('input').forEach(cb=>{
 const key='mission-'+dayKey+'-'+cb.dataset.key;
 cb.checked=localStorage.getItem(key)==='1';
 cb.addEventListener('change',()=>{localStorage.setItem(key,cb.checked?'1':'0');update()});
});
function update(){
 const all=[...document.querySelectorAll('input')];
 const n=all.filter(x=>x.checked).length;
 document.getElementById('progress').textContent=n+' / 5 complete';
}
function resetToday(){
 document.querySelectorAll('input').forEach(cb=>{cb.checked=false;localStorage.removeItem('mission-'+dayKey+'-'+cb.dataset.key)});
 update();
}
update();
</script></body></html>
